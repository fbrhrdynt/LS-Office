name: LS Office CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Backend syntax checks
        run: for f in server/*.mjs server/lib/*.mjs server/video/*.mjs scripts/*.mjs; do node --check "$f"; done
      - run: npm test
      - run: npm run test:workflow
      - run: npm run test:social-oauth
      - run: npm run build
      - name: Remotion bundle
        run: npm run build:remotion
