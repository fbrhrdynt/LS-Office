name: LS Office CI

on:
  pull_request:
    branches: [main, feat/director-session-video-pipeline, feat/approval-gated-production]
  push:
    branches: [main, feat/director-session-video-pipeline, feat/approval-gated-production, feat/social-account-foundation]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Backend syntax checks
        run: |
          node --check server/index.mjs
          node --check server/worker.mjs
          node --check server/video.mjs
          node --check server/workflows.mjs
      - name: Workflow routing tests
        run: npm run test:workflow
      - name: Existing application tests
        run: npm test
      - name: Production build
        run: npm run build
