# Included inside the HTTPS server block of office.febro.id (installed as /etc/nginx/snippets/ls-office-api.conf).
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header X-Content-Type-Options nosniff always;
add_header Referrer-Policy same-origin always;
add_header X-Frame-Options SAMEORIGIN always;

location = /api/auth/login {
    limit_req zone=lsoffice_login burst=5 nodelay;
    proxy_pass http://127.0.0.1:3215;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

location /api/ {
    proxy_pass http://127.0.0.1:3215/api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering off;
    proxy_read_timeout 3600s;
}

# Director-only previews of Web Dev work (checked against the Director session).
location = /_lsoffice_auth {
    internal;
    proxy_pass http://127.0.0.1:3215/api/auth/check;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_set_header Cookie $http_cookie;
}
location /preview/ {
    auth_request /_lsoffice_auth;
    error_page 401 = @lsoffice_login;
    alias /var/lib/ls-office-dev/previews/;
    try_files $uri $uri/ $uri/index.html =404;
    add_header Cache-Control "no-store" always;
}
location @lsoffice_login { return 302 /?login=preview; }

# Websites published by the Web Dev team (public).
location /sites/ {
    alias /var/lib/ls-office-dev/sites/;
    try_files $uri $uri/ $uri/index.html =404;
}
